<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch Status</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --line:#dde1e6; --muted:#5b6672;
          --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --unk:#57606a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --card:#161b22; --line:#30363d; --muted:#8b949e;
            --ok:#3fb950; --warn:#d29922; --bad:#f85149; --unk:#8b949e; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:14px/1.45 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:16px; margin:24px 0 8px; }
  h3 { font-size:13px; margin:16px 0 6px; color:var(--muted); font-weight:600; }
  h3:first-of-type { margin-top:8px; }
  #meta { color:var(--muted); margin-bottom:8px; }
  #hosts span { display:inline-block; margin-right:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:0; }
  .badge { font-weight:600; }
  .ok { color:var(--ok); } .outdated { color:var(--warn); }
  .error { color:var(--bad); } .unknown { color:var(--unk); }
  .group-head { background:var(--bg); text-transform:uppercase; font-size:11px; letter-spacing:.03em; }
  #banner { color:var(--bad); margin:8px 0; }
</style>
</head>
<body>
<main>
  <h1>Patch Status</h1>
  <div id="meta"></div>
  <div id="hosts"></div>
  <div id="banner"></div>
  <h2>Core Infra</h2>
  <h3>Host</h3>
  <div class="card"><table id="core-host"></table></div>
  <h3>LXC</h3>
  <div class="card"><table id="core-lxc_os"></table></div>
  <h3>VMs</h3>
  <div class="card"><table id="core-vm_os"></table></div>
  <h3>Backups</h3>
  <div class="card"><table id="core-backup"></table></div>
  <h2>Application</h2>
  <h3>VM OS</h3>
  <div class="card"><table id="app-vm_os"></table></div>
  <h3>Applications</h3>
  <div class="card"><table id="app-applications"></table></div>
  <h3>Backups</h3>
  <div class="card"><table id="app-backup"></table></div>
  <h3>Other</h3>
  <div class="card"><table id="app-other"></table></div>
</main>
<script>
const SYMBOL = { ok: "✔ ok", outdated: "▲ outdated", error: "✖ error", unknown: "? unknown" };
const COLS = ["Component", "Host", "Kind", "Current", "Latest", "Status"];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function age(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "unknown";
  let s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 172800) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}

const STATUS_ORDER = ["error", "outdated", "unknown", "ok"];

function statusOf(c) {
  return c.stale ? "outdated" : (SYMBOL[c.status] ? c.status : "unknown");
}

function renderTable(table, rows) {
  table.replaceChildren();
  const head = el("tr");
  COLS.forEach(c => head.append(el("th", c)));
  table.append(head);
  if (!rows.length) {
    const tr = el("tr"); const td = el("td", "No components"); td.colSpan = COLS.length;
    tr.append(td); table.append(tr); return;
  }
  const groups = new Map(STATUS_ORDER.map(s => [s, []]));
  for (const c of rows) groups.get(statusOf(c)).push(c);
  for (const status of STATUS_ORDER) {
    const groupRows = groups.get(status);
    if (!groupRows.length) continue;
    const groupHead = el("tr");
    const th = el("td", (SYMBOL[status] ?? status) + " (" + groupRows.length + ")", "badge group-head " + status);
    th.colSpan = COLS.length;
    groupHead.append(th);
    table.append(groupHead);
    for (const c of groupRows) {
      const tr = el("tr");
      const isBackup = c.kind === "backup";
      tr.append(el("td", c.name), el("td", c.host), el("td", c.kind));
      tr.append(el("td", isBackup && c.current ? age(c.current) : (c.current ?? "-")));
      tr.append(el("td", c.latest ?? "-"));
      const label = (SYMBOL[c.status] ?? "? " + (c.status ?? "unknown")) + (c.stale ? " (stale)" : "");
      const td = el("td", label, "badge " + status);
      if (c.error) td.title = c.error;
      tr.append(td);
      table.append(tr);
    }
  }
}

function render(doc) {
  const meta = document.getElementById("meta");
  meta.textContent = "Updated " + age(doc.generated_at);
  meta.title = String(doc.generated_at ?? "");
  const hosts = document.getElementById("hosts");
  hosts.replaceChildren();
  const hostsObj = doc.hosts && typeof doc.hosts === "object" ? doc.hosts : {};
  for (const [name, h] of Object.entries(hostsObj)) {
    const s = el("span", name + ": " + (h.ok ? "✔ ok" : "✖ " + (h.error || "error")), h.ok ? "ok" : "error");
    hosts.append(s);
  }
  const comps = Array.isArray(doc.components) ? doc.components : [];
  function section(id, group, kinds) {
    renderTable(document.getElementById(id),
                comps.filter(c => c.group === group && kinds.includes(c.kind)));
  }
  section("core-host", "core", ["proxmox", "host_os"]);
  section("core-lxc_os", "core", ["lxc_os"]);
  section("core-vm_os", "core", ["vm_os"]);
  section("core-backup", "core", ["backup"]);
  const APP_KINDS = ["vm_os", "docker_app", "backup"];
  section("app-vm_os", "app", ["vm_os"]);
  section("app-applications", "app", ["docker_app"]);
  section("app-backup", "app", ["backup"]);
  renderTable(document.getElementById("app-other"),
              comps.filter(c => c.group === "app" && !APP_KINDS.includes(c.kind)));
  document.getElementById("banner").textContent = "";
}

async function load() {
  try {
    const r = await fetch("/status.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 503 ? "no data collected yet" : "HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById("banner").textContent = "Cannot load status: " + e.message;
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
